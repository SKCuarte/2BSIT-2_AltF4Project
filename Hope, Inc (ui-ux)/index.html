<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Register | Hope, Inc. ERP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="registration-page">
    <a class="logo" href="#" aria-label="Hope, Inc.">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
        <circle cx="16" cy="16" r="16" class="mk-bg"/>
        <path d="M6 22a10 10 0 0 1 20 0z" class="mk-sun"/>
        <rect x="6" y="23.5" width="20" height="2.5" rx="1.25" class="mk-line"/>
      </svg>
      <span>Hope, Inc.</span>
    </a>

    <section class="registration-card" aria-labelledby="registration-title">
      <h1 id="registration-title">Create your account</h1>
      <p class="sub">Register to get started with Hope, Inc. ERP.</p>
      <p class="approval-note">New accounts are assigned the User role and remain pending approval.</p>

      <form id="registration-form">
        <label for="first-name">First Name</label>
        <input id="first-name" name="firstName" type="text" autocomplete="given-name" required>

        <label for="last-name">Last Name</label>
        <input id="last-name" name="lastName" type="text" autocomplete="family-name" required>

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <button class="pri full" type="submit">Submit registration</button>
        <div class="oauth-divider" aria-hidden="true"><span>or</span></div>
        <button class="google-sign-in" type="button" disabled aria-describedby="google-sign-in-status">
          <span class="google-mark" aria-hidden="true">G</span>
          Continue with Google
        </button>
        <p id="google-sign-in-status" class="oauth-status">Google sign-in is not available yet.</p>
        <p id="registration-message" class="msg" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
