<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Phone — empty products | Hope, Inc. ERP</title>
<link rel="stylesheet" href="states.css">
</head>
<body class="phone-stage">
<div class="phone">
  <div class="phone-top"><div class="left"><span class="hamburger"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span><span class="title">Product</span></div><span class="role-badge">Super Admin</span></div>
  <div class="phone-body">
  <h1 class="view-title">Product</h1>
  <p class="view-sub">Active products with their unit and current price.</p>
  <div class="toolbar">
    <div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><input class="input" placeholder="Search product ID or name"></div>
    <select class="select"><option selected>All units</option><option>pcs</option><option>pair</option><option>meter</option></select>
    <select class="select"><option selected>Active</option><option>All statuses</option><option>Inactive</option></select>
    <button class="btn btn-primary span-2">Add product</button>
  </div>
  <div class="empty-state">
    <span class="empty-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5L12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5L12 12l8.5-4.5M12 12v9"/></svg></span>
    <h3>No products yet</h3>
    <p>Products you add will appear here with their unit and effective current price.</p>
    <button class="btn btn-primary">Add product</button>
  </div>
</div>
</div>
</body>
</html>
