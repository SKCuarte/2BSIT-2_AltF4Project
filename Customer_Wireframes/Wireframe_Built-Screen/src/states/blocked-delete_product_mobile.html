<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Phone — blocked delete | Hope, Inc. ERP</title>
<link rel="stylesheet" href="states.css">
</head>
<body class="phone-stage">

  <div class="phone">
  <div class="phone-top"><div class="left"><span class="hamburger"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span><span class="title">Product</span></div><span class="role-badge">Super Admin</span></div>
  <div class="phone-body">
    <h1 class="view-title">Product</h1>
    <p class="view-sub">Active products.</p>
    <div class="card-list" style="margin-top:14px">
      <div class="m-card"><div class="m-card-top"><span class="m-card-name">Industrial Widget A</span><span class="pill active"><span class="dot"></span>Active</span></div><div class="m-card-meta">P-001 · pcs · <b>$13.75</b></div><div class="row-actions"><button class="btn btn-outline btn-sm">Edit</button><button class="btn btn-danger btn-sm">Deactivate</button></div></div>
    </div></div>
</div>
  <div class="backdrop"></div>
  <div class="dialog blocked">
    <div class="dialog-head"><span class="dialog-icon warn">!</span><div><h2>Industrial Widget A can’t be deactivated</h2><p class="sub">3 records depend on this product.</p></div></div>
    <div class="child-table">
      <table><thead><tr><th>Record</th><th>Reference</th><th>Detail</th></tr></thead>
      <tbody>
        <tr><td>Sales line</td><td class="num">T-001</td><td class="num">Qty 10</td></tr>
        <tr><td>Sales line</td><td class="num">T-003</td><td class="num">Qty 20</td></tr>
        <tr><td>Price entry</td><td class="num">—</td><td class="num">2026-10-01 · $13.75</td></tr>
      </tbody></table>
    </div>
    <p class="impact">No data was changed.</p>
    <div class="dialog-actions"><button class="btn btn-primary">Close</button></div>
  </div>
</body>
</html>
